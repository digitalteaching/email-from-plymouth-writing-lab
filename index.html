<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Writing Lab – An email from Plymouth</title>
<style>
:root{--navy:#14233B;--ink:#14233B;--mut:#5B6779;--desk:#E6ECF3;--paper:#fff;--line:#CCD6E2;--soft:#F1F5F9;
 --blue:#2456A6;--red:#CF3A3A;--cran:#C24555;--pine:#3F8A69;--gold:#E2A93B;--gold2:#B97A0E;
 --c-have:#3C7DBF;--c-been:#E2A93B;--c-ing:#3F8A69;--c-dur:#C24555;
 --ok:#2F7D59;--okbg:#E3F3EA;--bad:#B23A4B;--badbg:#FBE7EA;--or:#9A5B00;--orbg:#FFF1D6;--c:var(--blue);
 --type:"American Typewriter","Courier Prime","Rockwell","Courier New",Georgia,serif;
 --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
 --mailf:-apple-system,system-ui,"Helvetica Neue","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--desk);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--type);font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:2.1rem}h2{font-size:1.4rem}h3{font-size:1.05rem}
p{margin:.5em 0}
:focus-visible{outline:3px solid var(--c-have);outline-offset:2px}
.muted{color:var(--mut)}.small{font-size:.86rem}
#app{min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 150px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--navy);color:#fff;min-height:56px}
.top .ttl{font-family:var(--type);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:600;padding:8px 12px;border-radius:10px;white-space:nowrap}
.card .back,.link{border:0;background:none;color:var(--mut);text-decoration:underline;padding:4px 0;font-weight:500}
.pbar{flex:1;height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.card .pbar{background:var(--soft)}.card .pbar i{background:var(--pine)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 16px;box-shadow:0 1px 0 var(--line)}
.kicker{display:block;font-size:.84rem;font-weight:700;color:var(--c);margin-bottom:.25em}
.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;padding:12px 20px;min-height:46px;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{background:#B9C3D0;cursor:not-allowed}
.btn.soft{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost{background:none;color:var(--mut);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:7px 13px;font-size:.9rem;border-radius:10px;min-height:38px}
.btn.send{background:var(--red)}
.btn.soft.cur{background:var(--navy);color:#fff;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 13px;font-weight:600;text-align:left}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.used{opacity:.25;pointer-events:none}
.chip.no{background:var(--badbg);border-color:#E9B6BD;opacity:.6;pointer-events:none;text-decoration:line-through}
.chip.yes{background:var(--okbg);border-color:#9FD3B8;color:var(--ok)}
.chip small{font-weight:400;color:var(--mut);margin-left:6px}
.chip.on small{color:#D5DEEA}
input.txt,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;background:#fff;outline:none}
input.txt:focus,textarea:focus{border-color:var(--c-have);box-shadow:0 0 0 4px rgba(60,125,191,.18)}
.dt{display:block;font-size:.84em;color:var(--mut);font-weight:400;margin-top:1px;line-height:1.35}
.de{color:var(--mut);font-size:.95rem;margin-top:-.2em}

/* ---------- home ---------- */
.homegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:22px}
@media(max-width:860px){.homegrid{grid-template-columns:1fr}}
.air{background:#fff;border:11px solid;border-image:repeating-linear-gradient(-45deg,var(--red) 0 13px,#fff 13px 26px,var(--blue) 26px 39px,#fff 39px 52px) 11;box-shadow:0 14px 30px -18px rgba(20,35,59,.55)}
.air .in{padding:18px 22px 20px}
.mhead{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--mailf);font-size:.92rem;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.mhead span{color:var(--mut)}
.mhead b{font-weight:600}
.mbody{font-family:var(--mailf);font-size:1.02rem;line-height:1.55}
.mbody p{margin:0 0 .85em}.mbody p:last-child{margin:0}
.mbody b{background:linear-gradient(transparent 62%,#FFE08A 62%);font-weight:600}
.brief h1{margin-top:.1em}
.asks{list-style:none;margin:10px 0 14px;padding:0}
.asks li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line)}
.asks li:first-child{border-top:0}
.asks i{font-style:normal;font-family:var(--type);color:var(--red);font-weight:700}
.asks li.y{color:var(--ok)}.asks li.y i{color:var(--ok)}
.stars{letter-spacing:2px;color:var(--gold2);font-size:1.1rem;white-space:nowrap}
.stars i{font-style:normal;color:#C9D2DE}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
/* a station is a postage stamp: perforated edge, value in the corner, postmark when done */
.stn{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;border:0;background:#fff;padding:18px;min-height:132px;width:100%}
.stn::before{content:"";position:absolute;inset:-5px;border:10px dotted var(--desk);pointer-events:none}
.stn .val{flex:none;width:62px;height:78px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--type);font-weight:700;font-size:1.7rem;line-height:1}
.stn .val small{font-size:1.25rem;margin-top:4px}
.stn .tx{flex:1;min-width:0}
.stn b{display:block;font-family:var(--type);font-size:1.12rem;line-height:1.2;margin-bottom:3px}
.stn.lock{opacity:.55;cursor:not-allowed}
.stn.lock .val{background:#98A4B5}
.stn.next .val{animation:pulse 1.6s infinite}
.stn .pm{position:absolute;right:10px;bottom:8px;border:2px solid var(--ok);color:var(--ok);border-radius:50%;width:62px;height:62px;display:grid;place-items:center;transform:rotate(-14deg);font-family:var(--type);font-size:.7rem;font-weight:700;line-height:1.1;text-align:center;background:rgba(255,255,255,.85)}
.stn.gz{width:100%;margin-top:16px;min-height:0;align-items:center}
.stn.gz .val{height:62px}
.homefoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;color:var(--mut);font-size:.86rem}
.homefoot button{border:0;background:none;color:var(--mut);text-decoration:underline}
.homefoot input{width:120px;border:1.5px solid var(--line);border-radius:9px;padding:4px 8px;background:#fff}

/* ---------- exercises ---------- */
.big{font-size:1.4rem;line-height:1.8;font-weight:600}
.fb{border-radius:12px;padding:12px 16px;margin-top:14px;background:var(--orbg);border:1.5px solid #F0D49A}
.fb.ok{background:var(--okbg);border-color:#9FD3B8}
.fb.bad{background:var(--badbg);border-color:#E9B6BD}
.fb ul{margin:.4em 0;padding-left:0;list-style:none}
.fb li{margin:.4em 0}
.note{background:var(--soft);border-radius:11px;padding:10px 14px;font-size:.94rem}
.line{min-height:62px;border:2px dashed #B9C6D6;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;background:#FBFCFE}
.line:empty::before{content:"Tap the parts in the right order";color:#9AA7B8;padding-left:8px}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.opts .chip{font-size:1.1rem;padding:12px 18px}
.opts.col{flex-direction:column;align-items:stretch}
.opts.two .chip{flex:1;text-align:center;font-family:var(--type);font-size:1.5rem;padding:16px}
.gap{display:inline-block;min-width:92px;text-align:center;border-bottom:3px solid var(--navy);padding:0 10px;color:#9AA7B8}
.gap.done{border-color:var(--pine);color:var(--ok);background:var(--okbg);border-radius:6px 6px 0 0}
.cards{display:flex;flex-direction:column;gap:6px}
.fc{background:#FFF8E3;border-left:4px solid var(--gold);border-radius:4px 10px 10px 4px;padding:6px 12px;font-size:.92rem}
.vin{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.3rem;font-weight:600}
.vin input{width:300px;max-width:100%;font-size:1.2rem;font-weight:700;text-align:center}
.vin .v{font-weight:400;color:var(--mut);font-size:1rem}
/* model email (station 1) */
.model{font-family:var(--mailf);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.model .mp{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 16px;border-left:5px solid transparent;white-space:pre-line;line-height:1.5;font-size:1.02rem}
.model .mp.sub{background:var(--soft);font-weight:600;border-bottom:1px solid var(--line)}
.model .mp.sub::before{content:"Subject: ";color:var(--mut);font-weight:400}
.model .mp.seen{border-left-color:var(--pine)}
.model .mp.cur{background:#FFF6D8;border-left-color:var(--gold)}
.model .tag{display:inline-block;font-family:var(--sans);font-size:.74rem;font-weight:700;color:#fff;background:var(--pine);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.mgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}}
/* matching */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 14px}
.match button{min-height:54px}
.match .chip.pick{background:#E3EEFB;border-color:var(--c-have)}
/* grammar colour code, same as in the lessons */
.recipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--type);font-weight:700;margin:6px 0}
.recipe span{border-radius:8px;padding:5px 11px;color:#fff}
.r-h,.t-h{background:var(--c-have)}.r-b,.t-b{background:var(--c-been);color:#3B2A00!important}.r-g,.t-g{background:var(--c-ing)}.r-d,.t-d{background:var(--c-dur)}
.t-h,.t-b,.t-g,.t-d{color:#fff;border-radius:6px;padding:1px 5px}
.t-v{border-bottom:3px solid #9CB8DA}
.t-u{border-bottom:3px dotted var(--pine)}
.t-r{background:var(--badbg);color:var(--bad);border-radius:6px;padding:1px 5px;border-bottom:3px solid var(--bad)}
.t-o{background:var(--orbg);color:var(--or);border-radius:6px;padding:1px 5px;border-bottom:3px dotted var(--or)}
.an{font-size:1.15rem;font-weight:500;line-height:1.9;white-space:pre-wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--mut);margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.two div{background:var(--soft);border-radius:11px;padding:10px 12px;font-size:.92rem}
.two b{display:block}

/* ---------- writing ---------- */
.wgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.wgrid{grid-template-columns:1fr}}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.dot{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--mut);font-size:.9rem;padding:0}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.on{outline:3px solid rgba(60,125,191,.45);border-color:var(--c-have);color:var(--c-have)}
.dot.ok.on{color:#fff}
.dot.opt{border-style:dashed}
#sin{font-size:1.15rem;font-weight:500;min-height:54px;resize:vertical;margin:10px 0;font-family:var(--mailf);line-height:1.5}
.starters .chip,.bank .chip{font-size:.9rem;padding:6px 10px;font-weight:600}
.starters>.small,.tools>.small{flex-basis:100%;margin-bottom:-4px}
.bank{background:var(--soft);border-radius:12px;padding:12px;margin-top:12px}
.bank h3{margin:.8em 0 .35em;font-family:var(--sans);font-size:.82rem;font-weight:700;color:var(--mut)}
.bank h3:first-child{margin-top:0}
.bank .fc{border:0;border-left:4px solid var(--gold);text-align:left;width:100%}
.bank .fc.got{background:#FFF1C4}
.plan span{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 9px;margin:2px;font-size:.88rem;font-weight:600}
/* the mail window */
.mailwin{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 24px -18px rgba(20,35,59,.6)}
.mailwin .bar{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#EDF1F6;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--mut);font-weight:600}
.mailwin .bar i{width:10px;height:10px;border-radius:50%;background:#C6CFDB}
.mailwin .bar span{margin-left:6px}
.mailwin .fld{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid #E4EAF1;font-family:var(--mailf);font-size:.92rem}
.mailwin .fld span{color:var(--mut);width:62px;flex:none}
.mailwin .txt{padding:12px 14px 16px;font-family:var(--mailf);font-size:.98rem;line-height:1.55}
.mailwin .para{margin:0 0 .9em}
.mailwin .para:last-child{margin:0}
.seg{padding:1px 0;border-radius:4px;white-space:pre-line}
.seg.tap{cursor:pointer}
.seg.tap:hover,.seg.on{background:#FFF1C4;box-shadow:0 0 0 2px #FFF1C4}
.hole{display:inline-block;border:1.5px dashed #B9C6D6;border-radius:7px;padding:0 8px;margin:2px 3px 2px 0;color:#8E9BAD;font-size:.82rem;font-family:var(--sans);background:none}
.hole.on{border-color:var(--c-have);color:var(--c-have);border-style:solid}
.meter{display:grid;gap:8px}
.meter div{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:11px;padding:10px 14px}
.meter .y{background:var(--okbg)}
.tick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;margin-top:8px;font-weight:600}
.tick i{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid #98A4B5;display:grid;place-items:center;font-style:normal;color:#fff}
.tick.on{border-color:#9FD3B8;background:var(--okbg)}.tick.on i{background:var(--ok);border-color:var(--ok)}
.sent{text-align:center}
.sent .air{text-align:left;max-width:680px;margin:14px auto}
#qr{width:min(460px,92%);height:auto;image-rendering:pixelated;border:10px solid #fff;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.pre{white-space:pre-wrap}

/* ---------- games ---------- */
.g2{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:860px){.g2{grid-template-columns:1fr}}
.gcard{border-top:8px solid var(--c);margin:0}
.ghud{display:flex;gap:16px;align-items:center;font-weight:700;font-size:1.2rem;margin-bottom:8px}
.gmsg{min-height:1.9em;text-align:center;font-weight:700}.gmsg.y{color:var(--ok)}.gmsg.n{color:var(--bad)}
.gbig{font-family:var(--type);font-size:1.9rem;font-weight:600;text-align:center;margin:18px 0 22px}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.memo.n10{grid-template-columns:repeat(5,1fr)}
.mcard{min-height:84px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:1rem;padding:6px}
.mcard span{display:none}.mcard::before{content:"?";font-family:var(--type);font-size:1.6rem}
.mcard.up{color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}.mcard.up::before{content:none}.mcard.up span{display:inline}
.mcard.up.b{background:#E3EEFB}.mcard.up.p{background:#FFF1D6}.mcard.up.ok{background:var(--okbg);color:var(--ok)}

/* ---------- tip button ---------- */
.buddy{position:fixed;right:16px;bottom:14px;z-index:20;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.buddy>*{pointer-events:auto}
.tipbtn{border:0;width:62px;height:62px;border-radius:50%;background:var(--gold);color:#3B2A00;font-family:var(--type);font-weight:700;font-size:.95rem;box-shadow:0 6px 16px -6px rgba(20,35,59,.6)}
.bub{position:relative;max-width:340px;background:#fff;border:1.5px solid var(--navy);border-radius:14px 14px 4px 14px;padding:12px 30px 12px 14px;font-size:.95rem;box-shadow:0 8px 20px -10px rgba(20,35,59,.6);margin-bottom:30px;animation:pop .25s}
.bub .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--mut);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}
.conf{position:fixed;top:-20px;width:11px;height:17px;border-radius:2px;z-index:40;animation:fall linear forwards;pointer-events:none}
.bigstars{font-size:3rem;letter-spacing:8px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.bigstars .off{filter:grayscale(1);opacity:.25}
.pop{animation:pop .3s}
.miss{animation:shake .35s}
@keyframes pop{from{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(36,86,166,.22)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- teacher ---------- */
table.plan{border-collapse:collapse;width:100%;font-size:.92rem}
table.plan td,table.plan th{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border-radius:7px;padding:2px 8px;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px 10px 3px 3px;padding:7px 14px;font-weight:600}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.revtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pen{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:600}
.pen.on{outline:3px solid var(--navy)}
.p-y,.m-y{background:#FFF3A6}.p-g,.m-g{background:#BDEBCD}.p-r,.m-r{background:#FFC6BF}.p-b,.m-b{background:#C9DCFF}
#rtext{font-family:var(--mailf);font-size:1.3rem;line-height:1.9;white-space:pre-wrap;user-select:none;-webkit-user-select:none;margin:0}
#rtext.paint{touch-action:none;cursor:crosshair}
#rtext .w,.printonly span{border-radius:5px;padding:1px 2px}
.statrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.statrow span{background:var(--soft);border-radius:8px;padding:3px 9px;font-size:.84rem;font-weight:600}
.statrow span.y{background:var(--okbg);color:var(--ok)}
.scan{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.scan video{flex:1;min-height:0;object-fit:contain}
.scan .sbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:#111;color:#fff}
.scan.hit{outline:10px solid #3ddc84;outline-offset:-10px}
.printonly{display:none}
@media print{body{background:#fff}#app>*:not(.printonly){display:none!important}.printonly{display:block;font-size:12.5pt;line-height:1.6}.printonly h3{margin-top:1.4em}.printonly p{white-space:pre-wrap}}
</style>
</head>
<body>
<div id="app"></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],

const app=document.getElementById('app');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(LOCK.k)||''}catch(e){return ''}},set=v=>{try{localStorage.setItem(LOCK.k,v)}catch(e){}};
async function unlock(pw){try{const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pw).trim().toLowerCase()),'PBKDF2',false,['deriveKey']);

  app.innerHTML='';const s=document.createElement('script');s.textContent="'use strict';\n"+code;document.body.appendChild(s);return true}catch(e){return false}}
(async function(){
  const m=/^#pw=(.+)$/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(await unlock(v)){set(v);return}}
  const saved=get();if(saved&&await unlock(saved))return;
  app.innerHTML='<div class="wrap" style="max-width:560px;padding-top:12vh"><div class="card"><span class="kicker">Writing Lab · An email from Plymouth</span><h1>Password</h1><div class="row"><input class="txt" id="pw" style="flex:1;min-width:200px" placeholder="Password from your teacher" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn" id="pwgo">Open</button></div><p class="small muted" id="pwmsg" style="margin:.8em 0 0">This page is for your class only.</p></div></div>';
  const i=document.getElementById('pw'),go=async()=>{if(await unlock(i.value))set(i.value);else{document.getElementById('pwmsg').textContent=window.crypto&&crypto.subtle?'That is not the password. Try again.':'This browser cannot open the page. Please use Safari, Chrome, Edge or Firefox.';i.select()}};
  document.getElementById('pwgo').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};i.focus();
